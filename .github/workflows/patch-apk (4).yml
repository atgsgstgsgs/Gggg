# Upload an APK, get it back patched with a real-time voice changer (LSPatch, no root).
#
# Setup: put this file in a PRIVATE GitHub repo at .github/workflows/patch-apk.yml
# Use:   Releases -> Draft a new release -> attach the APK (or .apkm/.xapk/.apks bundle) -> Publish.
#        Patched APKs are attached to that same release and to the run's Artifacts.
#   or:  Actions -> "Patch APK" -> Run workflow -> paste direct download URL(s).
# Pitch: negative = deeper, positive = higher. Run-workflow input; releases use -4.
name: Patch APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apk_urls:
        description: Direct URL(s) to the APK, split APKs or a .apkm/.xapk/.apks bundle (space-separated)
        required: true
      semitones:
        description: Pitch shift in semitones (negative = deeper)
        default: "-4"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SEMITONES: ${{ github.event.inputs.semitones || '-4' }}
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.event.release.tag_name }}
      APK_URLS: ${{ github.event.inputs.apk_urls }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build voice-changer module
        run: |
          set -euo pipefail
          [[ "$SEMITONES" =~ ^-?[0-9]+(\.[0-9]+)?$ ]] || { echo "semitones must be a number"; exit 1; }
          M=voicemod
          J=$M/app/src/main/java/dev/voicemod
          X=$M/xposed-stub/src/main/java/de/robv/android/xposed
          mkdir -p "$(dirname $M/settings.gradle)"
          cat > $M/settings.gradle <<'EOF_A'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'voicemod'
          include ':app', ':xposed-stub'
          EOF_A
          mkdir -p "$(dirname $M/build.gradle)"
          cat > $M/build.gradle <<'EOF_B'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_B
          mkdir -p "$(dirname $M/xposed-stub/build.gradle)"
          cat > $M/xposed-stub/build.gradle <<'EOF_C'
          plugins { id 'java-library' }
          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          EOF_C
          mkdir -p "$(dirname $M/app/build.gradle)"
          cat > $M/app/build.gradle <<'EOF_D'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.voicemod'
              compileSdk 34
              defaultConfig {
                  applicationId 'dev.voicemod'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { compileOnly project(':xposed-stub') }
          EOF_D
          mkdir -p "$(dirname $M/app/src/main/AndroidManifest.xml)"
          cat > $M/app/src/main/AndroidManifest.xml <<'EOF_E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="VoiceMod" android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Real-time microphone pitch shifter" />
                  <meta-data android:name="xposedminversion" android:value="93" />
              </application>
          </manifest>
          EOF_E
          mkdir -p "$(dirname $M/app/src/main/assets/xposed_init)"
          cat > $M/app/src/main/assets/xposed_init <<'EOF_F'
          dev.voicemod.Hook
          EOF_F
          mkdir -p "$(dirname $J/Hook.java)"
          cat > $J/Hook.java <<'EOF_HOOK'
          package dev.voicemod;

          import android.content.Context;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.Toast;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          import java.io.BufferedReader;
          import java.io.FileReader;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.WeakHashMap;

          /**
           * Pitch-shifts everything the host app reads from the microphone via AudioRecord, and
           * reports (as toasts) which audio APIs the app really uses, so we know what to hook.
           */
          public class Hook implements IXposedHookLoadPackage {
              private static final String TAG = "VoiceMod";
              private static final WeakHashMap<AudioRecord, Shifter[]> STATE = new WeakHashMap<>();
              private static final ThreadLocal<int[]> DEPTH = new ThreadLocal<int[]>() {
                  @Override protected int[] initialValue() { return new int[1]; }
              };
              private static final Set<String> TOASTED = Collections.synchronizedSet(new HashSet<String>());
              private static String proc = "?";

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lp) {
                  String pn = lp.processName == null ? "?" : lp.processName;
                  int c = pn.indexOf(':');
                  proc = c >= 0 ? pn.substring(c + 1) : "main";
                  Log.i(TAG, "loaded in " + lp.packageName + " / " + pn + ", semitones=" + Config.SEMITONES);
                  if (lp.packageName != null && lp.packageName.equals(lp.processName)) {
                      toast("VoiceMod loaded (" + Config.SEMITONES + " semitones)", 4000);
                  }
                  hookRead();
                  hookProbes();
                  probeNativeLibs();
              }

              // ---------------------------------------------------------------- the actual voice change

              private void hookRead() {
                  XposedBridge.hookAllMethods(AudioRecord.class, "read", new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam p) {
                          int[] d = DEPTH.get();
                          d[0]++;
                          // read() overloads call each other; only the outermost call edits the data.
                          p.setObjectExtra("outer", d[0] == 1);
                          if (p.args.length > 0 && p.args[0] instanceof ByteBuffer) {
                              p.setObjectExtra("pos", ((ByteBuffer) p.args[0]).position());
                          }
                      }

                      @Override
                      protected void afterHookedMethod(MethodHookParam p) {
                          DEPTH.get()[0]--;
                          try {
                              if (!Boolean.TRUE.equals(p.getObjectExtra("outer"))) return;
                              Object r = p.getResult();
                              if (!(r instanceof Integer) || p.args.length == 0) return;
                              int n = (Integer) r;
                              if (n <= 0) return;
                              AudioRecord rec = (AudioRecord) p.thisObject;
                              if (rec.getAudioFormat() != AudioFormat.ENCODING_PCM_16BIT) {
                                  toastOnce("fmt", "AudioRecord format " + rec.getAudioFormat() + " (not 16-bit, skipped)");
                                  return;
                              }
                              Shifter[] sh = shifters(rec);
                              Object a0 = p.args[0];
                              if (a0 instanceof short[]) {
                                  short[] a = (short[]) a0;
                                  int off = (Integer) p.args[1];
                                  for (int i = 0; i < n; i++) {
                                      a[off + i] = sh[i % sh.length].process(a[off + i]);
                                  }
                              } else if (a0 instanceof byte[]) {
                                  shiftBytes(ByteBuffer.wrap((byte[]) a0), (Integer) p.args[1], n, sh);
                              } else if (a0 instanceof ByteBuffer) {
                                  Object pos = p.getObjectExtra("pos");
                                  shiftBytes(((ByteBuffer) a0).duplicate(),
                                          pos instanceof Integer ? (Integer) pos : 0, n, sh);
                              }
                              toastOnce("changed", "VoiceMod: mic is being changed");
                          } catch (Throwable t) {
                              Log.e(TAG, "hook error", t);
                          }
                      }
                  });
              }

              // ---------------------------------------------------------------- probes: which audio API is used?

              private void hookProbes() {
                  try {
                      XposedBridge.hookAllMethods(AudioRecord.class, "startRecording", new XC_MethodHook() {
                          @Override protected void afterHookedMethod(MethodHookParam p) {
                              AudioRecord r = (AudioRecord) p.thisObject;
                              toastOnce("ar", "[" + proc + "] Java AudioRecord started: " + r.getSampleRate()
                                      + " Hz, " + r.getChannelCount() + " ch, fmt " + r.getAudioFormat());
                          }
                      });
                      XposedBridge.hookAllMethods(MediaRecorder.class, "start", new XC_MethodHook() {
                          @Override protected void afterHookedMethod(MethodHookParam p) {
                              toastOnce("mr", "[" + proc + "] MediaRecorder started (voice-note path)");
                          }
                      });
                      XposedBridge.hookAllMethods(AudioManager.class, "setMode", new XC_MethodHook() {
                          @Override protected void afterHookedMethod(MethodHookParam p) {
                              toastOnce("mode" + p.args[0], "[" + proc + "] AudioManager mode -> " + p.args[0]
                                      + (Integer.valueOf(3).equals(p.args[0]) ? " (call)" : ""));
                          }
                      });
                  } catch (Throwable t) {
                      Log.e(TAG, "probe hook failed", t);
                  }
              }

              /** Native audio stacks show up as loaded libraries in /proc/self/maps once they are used. */
              private void probeNativeLibs() {
                  final String[][] keys = {
                          {"libOpenSLES", "OpenSL ES"}, {"libaaudio", "AAudio"}, {"liboboe", "Oboe"},
                          {"libmediandk", "NDK media"}, {"libaudioclient", "audioclient"}};
                  final Handler h = new Handler(Looper.getMainLooper());
                  h.postDelayed(new Runnable() {
                      int n;
                      @Override public void run() {
                          try {
                              BufferedReader br = new BufferedReader(new FileReader("/proc/self/maps"));
                              String line;
                              StringBuilder txt = new StringBuilder();
                              while ((line = br.readLine()) != null) {
                                  for (String[] k : keys) {
                                      if (line.contains(k[0])) {
                                          if (TOASTED.add("lib" + k[0])) {
                                              txt.append(txt.length() == 0 ? "" : ", ").append(k[1]);
                                          }
                                      }
                                  }
                              }
                              br.close();
                              if (txt.length() > 0) toast("[" + proc + "] native audio loaded: " + txt, 0);
                          } catch (Throwable t) {
                              Log.e(TAG, "maps probe failed", t);
                          }
                          if (++n < 24) h.postDelayed(this, 5000);
                      }
                  }, 5000);
              }

              // ---------------------------------------------------------------- helpers

              private static void toastOnce(String key, String msg) {
                  if (TOASTED.add(key)) toast(msg, 0);
              }

              /** On-screen feedback, since logcat isn't available without a PC. */
              private static void toast(final String msg, long delayMs) {
                  if (!Config.TOAST) return;
                  Log.i(TAG, msg);
                  try {
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override public void run() {
                              try {
                                  Object app = Class.forName("android.app.ActivityThread")
                                          .getMethod("currentApplication").invoke(null);
                                  if (app instanceof Context) {
                                      Toast.makeText((Context) app, msg, Toast.LENGTH_LONG).show();
                                  }
                              } catch (Throwable t) {
                                  Log.e(TAG, "toast failed", t);
                              }
                          }
                      }, delayMs);
                  } catch (Throwable t) {
                      Log.e(TAG, "toast failed", t);
                  }
              }

              private static void shiftBytes(ByteBuffer bb, int off, int n, Shifter[] sh) {
                  bb.order(ByteOrder.LITTLE_ENDIAN);
                  for (int i = 0; i < n / 2; i++) {
                      int idx = off + i * 2;
                      bb.putShort(idx, sh[i % sh.length].process(bb.getShort(idx)));
                  }
              }

              private static Shifter[] shifters(AudioRecord rec) {
                  synchronized (STATE) {
                      Shifter[] s = STATE.get(rec);
                      if (s == null) {
                          int ch = Math.max(1, rec.getChannelCount());
                          s = new Shifter[ch];
                          for (int i = 0; i < ch; i++) s[i] = new Shifter(rec.getSampleRate(), Config.SEMITONES);
                          STATE.put(rec, s);
                          Log.i(TAG, "mic capture hooked: " + rec.getSampleRate() + " Hz, " + ch + " ch");
                      }
                      return s;
                  }
              }
          }
          EOF_HOOK
          mkdir -p "$(dirname $J/Shifter.java)"
          cat > $J/Shifter.java <<'EOF_SHIFTER'
          package dev.voicemod;

          /**
           * Streaming pitch shifter: two crossfaded taps on a delay line whose delay
           * sweeps at (1 - ratio) samples per sample. Output length == input length,
           * so it can edit microphone buffers in place. One instance per channel.
           */
          final class Shifter {
              private final float[] buf;
              private final int size;
              private final int win;
              private final float inc;
              private int w;
              private float phase;

              Shifter(int sampleRate, float semitones) {
                  float ratio = (float) Math.pow(2.0, semitones / 12.0);
                  win = Math.max(256, (int) (sampleRate * 0.035f));
                  size = win + 8;
                  buf = new float[size];
                  inc = (1f - ratio) / win;
              }

              short process(short x) {
                  buf[w] = x;
                  float p2 = phase + 0.5f;
                  if (p2 >= 1f) p2 -= 1f;
                  float g1 = 0.5f - 0.5f * (float) Math.cos(2.0 * Math.PI * phase);
                  float g2 = 0.5f - 0.5f * (float) Math.cos(2.0 * Math.PI * p2);
                  float y = tap(phase * win) * g1 + tap(p2 * win) * g2;
                  w = (w + 1) % size;
                  phase += inc;
                  if (phase >= 1f) phase -= 1f;
                  else if (phase < 0f) phase += 1f;
                  if (y > 32767f) y = 32767f;
                  else if (y < -32768f) y = -32768f;
                  return (short) y;
              }

              private float tap(float delay) {
                  float pos = w - delay;
                  while (pos < 0f) pos += size;
                  int i0 = (int) pos;
                  float f = pos - i0;
                  int i1 = i0 + 1 == size ? 0 : i0 + 1;
                  return buf[i0] * (1f - f) + buf[i1] * f;
              }
          }
          EOF_SHIFTER
          printf 'package dev.voicemod;\nfinal class Config { static final float SEMITONES = %sf; static final boolean TOAST = true; }\n' "$SEMITONES" > $J/Config.java
          mkdir -p "$(dirname $X/IXposedHookLoadPackage.java)"
          cat > $X/IXposedHookLoadPackage.java <<'EOF_S0'
          package de.robv.android.xposed;

          public interface IXposedHookLoadPackage {
              void handleLoadPackage(de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam p) throws Throwable;
          }
          EOF_S0
          mkdir -p "$(dirname $X/callbacks/XC_LoadPackage.java)"
          cat > $X/callbacks/XC_LoadPackage.java <<'EOF_S1'
          package de.robv.android.xposed.callbacks;

          public class XC_LoadPackage {
              public static class LoadPackageParam {
                  public String packageName;
                  public String processName;
              }
          }
          EOF_S1
          mkdir -p "$(dirname $X/XC_MethodHook.java)"
          cat > $X/XC_MethodHook.java <<'EOF_S2'
          package de.robv.android.xposed;

          public class XC_MethodHook {
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}

              public static class MethodHookParam {
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setObjectExtra(String key, Object o) {}
                  public Object getObjectExtra(String key) { return null; }
              }
          }
          EOF_S2
          mkdir -p "$(dirname $X/XposedBridge.java)"
          cat > $X/XposedBridge.java <<'EOF_S3'
          package de.robv.android.xposed;

          public class XposedBridge {
              public static java.util.Set<?> hookAllMethods(Class<?> c, String name, XC_MethodHook cb) { return null; }
          }
          EOF_S3
          gradle -p $M :app:assembleDebug --no-daemon --stacktrace
          ls -l $M/app/build/outputs/apk/debug/

      - name: Fetch APKs
        run: |
          set -euo pipefail
          mkdir -p in out tools
          if [ "$EVENT" = release ]; then
            gh release download "$TAG" --dir in --pattern '*.apk' --pattern '*.apkm' --pattern '*.xapk' --pattern '*.apks'
          else
            n=0
            for u in $APK_URLS; do
              n=$((n+1))
              curl -fsSL --retry 3 -o "in/download$n.bin" "$u"
            done
          fi
          # Normalise: plain APKs stay, bundles (.apkm/.xapk/.apks) are unpacked to their split APKs.
          for f in in/*; do
            unzip -Z1 "$f" > /tmp/list.txt
            if grep -qx 'AndroidManifest.xml' /tmp/list.txt; then
              case "$f" in *.apk) ;; *) mv "$f" "$f.apk" ;; esac
            else
              unzip -o -j "$f" '*.apk' -d in/
              rm "$f"
            fi
          done
          ls -l in
          ls in/*.apk

      - name: Patch with LSPatch
        run: |
          set -euo pipefail
          gh release download --repo JingMatrix/LSPatch --pattern '*.jar' --dir tools --clobber
          JAR=$(ls tools/*.jar | head -n1)
          echo "Using $JAR"
          java -jar "$JAR" --help || true
          MOD=voicemod/app/build/outputs/apk/debug/app-debug.apk
          java -jar "$JAR" in/*.apk -m "$MOD" -l 2 -f -o out
          ls -l out

      - name: Persist signing key
        uses: actions/cache@v4
        with:
          path: ks
          key: voicemod-signing-key-v1

      - name: Repack and re-sign (fixes "problem parsing the package")
        run: |
          set -uo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir -p ks fixed
          if [ ! -f ks/key.jks ]; then
            keytool -genkeypair -keystore ks/key.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=VoiceMod"
          fi
          for f in out/*.apk; do
            b=$(basename "$f" .apk)
            echo "=== $f"; unzip -tq "$f" 2>&1 | tail -n1 || true
            # zipalign rewrites the zip from its central directory, dropping overlapping/mismatched headers
            if "$BT/zipalign" -f -p 4 "$f" "fixed/$b.apk" \
               && "$BT/apksigner" sign --ks ks/key.jks --ks-pass pass:android --key-pass pass:android \
                    --ks-key-alias key "fixed/$b.apk"; then
              echo "repacked: $(unzip -tq "fixed/$b.apk" 2>&1 | tail -n1)"
              mv "fixed/$b.apk" "$f"
            else
              echo "WARNING: repack failed, keeping original $f"
            fi
          done
          rm -f out/*.idsig

      - name: Verify patched APK
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for f in in/*.apk out/*.apk; do
            echo "=================== $f"
            ls -l "$f"
            unzip -tq "$f" | tail -n1 || true
            "$BT/aapt2" dump badging "$f" 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code|launchable" | head -n8 || true
            "$BT/apksigner" verify --verbose "$f" 2>&1 | head -n4 || true
          done

      - name: Diagnose (paste this log if install fails)
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $BT"
          for f in in/*.apk; do
            echo "=== ORIGINAL $f ($(stat -c%s "$f") bytes)"
            "$BT/aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          done
          for f in out/*.apk; do
            echo "=== PATCHED $f ($(stat -c%s "$f") bytes)"
            unzip -tq "$f"
            "$BT/aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
            "$BT/zipalign" -c 4 "$f" && echo "zipalign: OK" || echo "zipalign: NOT ALIGNED"
            "$BT/apksigner" verify --verbose "$f"
          done
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" out/*.apk --clobber
